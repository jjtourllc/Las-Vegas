<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <title>访客统计</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a0f;
            --bg-surface: #12121a;
            --bg-card: rgba(255,255,255,0.04);
            --bg-card-hover: rgba(255,255,255,0.08);
            --border-subtle: rgba(255,255,255,0.08);
            --text-primary: #f0f0f5;
            --text-secondary: rgba(240,240,245,0.6);
            --accent-green: #00e676;
            --accent-green-dim: rgba(0,230,118,0.15);
            --glow-green: 0 0 20px rgba(0,230,118,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 0.5rem;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 页面筛选标签 */
        .page-tabs {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .page-tab {
            padding: 0.6rem 1.5rem;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .page-tab:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-green);
        }
        .page-tab.active {
            background: var(--accent-green-dim);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.75rem 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-green);
            box-shadow: var(--glow-green);
            transform: translateY(-2px);
        }
        .stat-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
        }
        .stat-value {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent-green);
            line-height: 1.1;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(0,230,118,0.4);
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* 页面细分 */
        .page-stats {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .page-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }
        .page-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .page-name {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .page-name .icon {
            font-size: 1.3rem;
        }
        .page-meta {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .page-visitors {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-green);
            font-family: 'Noto Serif SC', serif;
        }
        .page-views {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* 最近记录 */
        .recent-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .recent-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .recent-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }
        .recent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.85rem;
        }
        .recent-item:last-child {
            border-bottom: none;
        }
        .recent-time {
            color: var(--accent-green);
            font-weight: 500;
        }
        .recent-page {
            color: var(--text-secondary);
        }

        /* 管理区域 */
        .admin-section {
            background: rgba(255,100,100,0.05);
            border: 1px solid rgba(255,100,100,0.2);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .admin-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,150,150,0.9);
            margin-bottom: 1rem;
        }
        .admin-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .admin-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid rgba(255,100,100,0.3);
            border-radius: 8px;
            background: rgba(255,100,100,0.1);
            color: rgba(255,150,150,0.9);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .admin-btn:hover {
            background: rgba(255,100,100,0.2);
            border-color: rgba(255,100,100,0.5);
        }

        /* 导航 */
        .nav-back {
            text-align: center;
            margin-top: 2rem;
        }
        .nav-back a {
            color: var(--accent-green);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .nav-back a:hover {
            color: #69f0ae;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-value {
                font-size: 2.2rem;
            }
            .page-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📊 访客统计面板</h1>
            <p>仅供管理员查看 · 24小时去重计数</p>
        </div>

        <!-- 页面筛选 -->
        <div class="page-tabs">
            <button class="page-tab active" onclick="filterByPage('all', this)">全部页面</button>
            <button class="page-tab" onclick="filterByPage('/index.html', this)">🏠 首页</button>
            <button class="page-tab" onclick="filterByPage('/explore-routes/index.html', this)">🗺️ 探索线路</button>
            <button class="page-tab" onclick="filterByPage('/photo-gallery.html', this)">📸 景点相册</button>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="total-visitors">0</div>
                <div class="stat-label">总独立访客</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="today-visitors">0</div>
                <div class="stat-label">今日访客</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔄</div>
                <div class="stat-value" id="total-views">0</div>
                <div class="stat-label">总访问次数</div>
            </div>
        </div>

        <!-- 页面细分统计 -->
        <div class="page-stats">
            <div class="page-title">各页面访客数据</div>
            <div class="page-grid" id="page-grid">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 最近访问记录 -->
        <div class="recent-section">
            <div class="recent-title">最近访问记录</div>
            <ul class="recent-list" id="recent-list">
                <!-- 动态填充 -->
            </ul>
        </div>

        <!-- 管理区域 -->
        <div class="admin-section">
            <div class="admin-title">管理工具（仅管理员）</div>
            <div class="admin-buttons">
                <button class="admin-btn" onclick="resetStats()">重置所有统计数据</button>
                <button class="admin-btn" onclick="exportData()">导出数据</button>
                <button class="admin-btn" onclick="forceVisit()">测试访问</button>
            </div>
        </div>

        <!-- 返回链接 -->
        <div class="nav-back">
            <a href="../index.html">← 回到首页</a>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'site_visitor_stats';
        let currentFilter = 'all';

        // 页面映射
        const pageNames = {
            '/index.html': { icon: '🏠', name: '首页' },
            '/explore-routes/index.html': { icon: '🗺️', name: '探索线路' },
            '/photo-gallery.html': { icon: '📸', name: '景点相册' },
            '/explore-routes/stats.html': { icon: '📊', name: '访客统计' }
        };

        // 初始化或获取统计数据
        function getStats() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                const initial = {
                    visitors: [],
                    totalViews: 0
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(data);
        }

        // 保存统计数据
        function saveStats(stats) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
        }

        // 生成唯一访客ID
        function getVisitorId() {
            let visitorId = localStorage.getItem('visitor_id');
            if (!visitorId) {
                visitorId = 'v_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('visitor_id', visitorId);
            }
            return visitorId;
        }

        // 记录访问
        function recordVisit() {
            const stats = getStats();
            const visitorId = getVisitorId();
            const now = new Date();
            const today = now.toISOString().split('T')[0];

            // 添加访问记录
            const visitRecord = {
                visitorId: visitorId,
                timestamp: now.toISOString(),
                page: window.location.pathname
            };

            stats.visitors.push(visitRecord);
            stats.totalViews++;
            saveStats(stats);
        }

        // 按页面筛选
        function filterByPage(page, btn) {
            currentFilter = page;
            
            // 更新按钮状态
            document.querySelectorAll('.page-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            btn.classList.add('active');

            renderPage();
        }

        // 获取某页面的独立访客
        function getPageVisitors(page) {
            const stats = getStats();
            const today = new Date().toISOString().split('T')[0];
            
            if (currentFilter === 'all') {
                // 全部页面
                const visitedIds = new Set();
                stats.visitors.forEach(v => {
                    if (v.timestamp.startsWith(today) && (!page || v.page === page)) {
                        visitedIds.add(v.visitorId);
                    }
                });
                return visitedIds.size;
            } else {
                // 指定页面
                const visitedIds = new Set();
                stats.visitors.forEach(v => {
                    if (v.timestamp.startsWith(today) && v.page === currentFilter) {
                        visitedIds.add(v.visitorId);
                    }
                });
                return visitedIds.size;
            }
        }

        // 获取某页面的总访问次数
        function getPageViews(page) {
            const stats = getStats();
            let count = 0;
            stats.visitors.forEach(v => {
                if (currentFilter === 'all') {
                    count++;
                } else if (v.page === currentFilter) {
                    count++;
                }
            });
            return count;
        }

        // 渲染页面
        function renderPage() {
            const stats = getStats();
            const now = new Date();
            const today = now.toISOString().split('T')[0];

            // 总独立访客
            const allVisitorIds = new Set();
            const filteredVisitors = stats.visitors.filter(v => {
                if (currentFilter === 'all') return true;
                return v.page === currentFilter;
            });
            filteredVisitors.forEach(v => allVisitorIds.add(v.visitorId));
            document.getElementById('total-visitors').textContent = allVisitorIds.size;

            // 今日访客（筛选后）
            const todayVisitorIds = new Set();
            filteredVisitors.forEach(v => {
                if (v.timestamp.startsWith(today)) {
                    todayVisitorIds.add(v.visitorId);
                }
            });
            document.getElementById('today-visitors').textContent = todayVisitorIds.size;

            // 总访问次数
            document.getElementById('total-views').textContent = filteredVisitors.length;

            // 页面细分统计
            const pageGrid = document.getElementById('page-grid');
            const pageStats = {};
            
            stats.visitors.forEach(v => {
                if (!pageStats[v.page]) {
                    pageStats[v.page] = { visitors: new Set(), views: 0 };
                }
                pageStats[v.page].visitors.add(v.visitorId);
                pageStats[v.page].views++;
            });

            pageGrid.innerHTML = Object.entries(pageStats).map(([page, data]) => {
                const info = pageNames[page] || { icon: '📄', name: page };
                return `
                    <div class="page-item">
                        <div class="page-name">
                            <span class="icon">${info.icon}</span>
                            <span>${info.name}</span>
                        </div>
                        <div class="page-meta">
                            <span class="page-views">${data.views} 次访问</span>
                            <span class="page-visitors">${data.visitors.size} 访客</span>
                        </div>
                    </div>
                `;
            }).join('');

            if (Object.keys(pageStats).length === 0) {
                pageGrid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 2rem;">暂无数据</div>';
            }

            // 最近访问记录
            const recentList = document.getElementById('recent-list');
            let recentVisits = stats.visitors.slice(-20).reverse();
            
            if (currentFilter !== 'all') {
                recentVisits = recentVisits.filter(v => v.page === currentFilter);
            }

            recentList.innerHTML = recentVisits.map(v => {
                const time = new Date(v.timestamp).toLocaleString('zh-CN', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                const info = pageNames[v.page] || { icon: '📄', name: v.page };
                return `
                    <li class="recent-item">
                        <span class="recent-time">${time}</span>
                        <span class="recent-page">${info.icon} ${info.name}</span>
                    </li>
                `;
            }).join('');

            if (recentVisits.length === 0) {
                recentList.innerHTML = '<li class="recent-item"><span style="color: var(--text-secondary);">暂无访问记录</span></li>';
            }
        }

        // 重置统计数据
        function resetStats() {
            if (confirm('确定要重置所有统计数据吗？此操作不可恢复！')) {
                if (confirm('再次确认：真的要删除所有访客数据吗？')) {
                    localStorage.removeItem(STORAGE_KEY);
                    renderPage();
                }
            }
        }

        // 导出数据
        function exportData() {
            const stats = getStats();
            const dataStr = JSON.stringify(stats, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `visitor-stats-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 测试访问
        function forceVisit() {
            recordVisit();
            renderPage();
            alert('测试访问已记录！');
        }

        // 页面加载时记录访问
        recordVisit();
        renderPage();
    </script>
</body>
</html>
